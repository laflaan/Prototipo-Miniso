<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía Toy Story Miniso Chile · Prototipo editable</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#E4002B;--red-d:#B8001F;--ink:#222222;--mut:#6A6A6A;--bg:#FFFFFF;--soft:#FFF4F6;--p1:#FFE3E8;--p2:#FFBFCA;--line:#F0D9DE;--sun:#FFC72C;--card:#FFFFFF;--pp:#FFF9FA;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F4F0F1;--mut:#B9AFB2;--bg:#1A1617;--soft:#2A2224;--p1:#3A2329;--p2:#5C2A35;--line:#3E3033;--card:#241E20;--pp:#211B1D}}
:root[data-theme="dark"]{--ink:#F4F0F1;--mut:#B9AFB2;--bg:#1A1617;--soft:#2A2224;--p1:#3A2329;--p2:#5C2A35;--line:#3E3033;--card:#241E20;--pp:#211B1D}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:17px;line-height:1.6}
h1,h2,h3,.brand,.btn,.pill{font-family:Poppins,Nunito,system-ui,Arial,sans-serif}
h1{font-size:clamp(30px,5vw,50px);line-height:1.08;margin:.2em 0 .35em;letter-spacing:-.02em}
h2{font-size:clamp(23px,3vw,31px);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h3{font-size:19px;margin:0 0 .35em}
a{color:var(--red)}
p{margin:0 0 1em;max-width:68ch}
img{max-width:100%}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:76px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--red);font-weight:800;font-size:21px;letter-spacing:.02em}
.smile{width:34px;height:34px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none}
.brand .logo{height:46px;width:auto;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lmlogo{height:54px;width:auto;margin-bottom:10px}
.search{flex:1;position:relative;max-width:430px}
.search input{width:100%;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;font-size:15px}
.search input:focus{border-color:var(--red);outline:none}
.sugg{position:absolute;top:48px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(90,0,20,.14);overflow:hidden;display:none}
.sugg a{display:block;padding:10px 16px;text-decoration:none;color:var(--ink);font-size:15px}
.sugg a:hover,.sugg a:focus{background:var(--soft)}
.sugg small{color:var(--mut);display:block}
nav.main{display:flex;gap:4px}
nav.main a{text-decoration:none;color:var(--ink);font-weight:700;font-size:15px;padding:8px 12px;border-radius:999px}
nav.main a:hover{background:var(--soft)}
.pts{font-family:Poppins,sans-serif;font-weight:700;font-size:14px;background:var(--red);color:#fff;border-radius:999px;padding:7px 13px;white-space:nowrap;border:0;cursor:pointer}
@media (max-width:860px){nav.main{display:none}.brand span{display:none}}
/* breadcrumb & stage */
.crumbs{font-size:14px;color:var(--mut);padding:18px 0 0}
.crumbs a{color:var(--mut);text-decoration:none}.crumbs a:hover{color:var(--red);text-decoration:underline}
.stage{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;border-radius:999px;padding:5px 13px;margin-top:14px}
.st-d{background:var(--p1);color:var(--red-d)}.st-c{background:var(--p2);color:#7A0016}.st-x{background:var(--red);color:#fff}
:root[data-theme="dark"] .st-c{color:#FFE3E8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st-c{color:#FFE3E8}:root:not([data-theme="light"]) .st-d{color:#FFB8C3}}
:root[data-theme="dark"] .st-d{color:#FFB8C3}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:16px;padding:13px 24px;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--red-d)}
.btn.ghost{background:transparent;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.btn.ghost:hover{background:var(--soft)}
.btn.small{font-size:14px;padding:9px 16px}
/* hero pillar */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding:26px 0 46px}
.hero .lead{font-size:19px;color:var(--mut);max-width:52ch}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.boxstage{background:var(--red);border-radius:36px;min-height:390px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;color:#fff;overflow:hidden}
.boxstage::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.09);right:-70px;top:-80px}
.boxstage::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07);left:-50px;bottom:-60px}
.bbox{position:relative;width:170px;height:150px;cursor:pointer;border:0;background:none;padding:0;z-index:2}
.bbox .body{position:absolute;bottom:0;left:10px;width:150px;height:112px;background:#fff;border-radius:14px;box-shadow:0 14px 0 rgba(0,0,0,.14)}
.bbox .lid{position:absolute;top:10px;left:0;width:170px;height:40px;background:#FFE3E8;border-radius:12px;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.bbox .rib{position:absolute;left:78px;top:10px;width:14px;height:140px;background:var(--sun);border-radius:4px}
.bbox .q{position:absolute;z-index:2;bottom:26px;left:10px;width:150px;text-align:center;font:800 40px Poppins,sans-serif;color:var(--red);text-shadow:0 0 0 #fff}
.bbox .q::before{content:"";position:absolute;left:58px;top:6px;width:34px;height:44px;background:#fff;border-radius:10px;z-index:-1}
.bbox.shake{animation:shake .5s}
.bbox.open .lid{transform:translate(26px,-34px) rotate(18deg)}
@keyframes shake{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
.reveal{margin-top:18px;min-height:96px;text-align:center;z-index:2}
.fig{display:inline-flex;align-items:center;gap:12px;background:#fff;color:var(--ink);border-radius:20px;padding:12px 18px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.fig .em{font-size:38px}
.fig b{font-family:Poppins,sans-serif;display:block}
.rar{font-size:13px;font-weight:800;border-radius:999px;padding:2px 9px;display:inline-block}
.r-com{background:#FFE3E8;color:#8A0019}.r-rar{background:var(--sun);color:#4A3200}.r-sec{background:#222;color:#FFD84D}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.boxstage .hint{font-size:14px;opacity:.9;z-index:2;margin-top:6px}
.boxstage .hint a{color:#fff}
/* pillar layout */
.pillar{display:grid;grid-template-columns:250px 1fr;gap:44px;padding-bottom:40px}
@media (max-width:860px){.pillar{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:104px;align-self:start;font-size:15px}
.toc b{font-family:Poppins,sans-serif;display:block;margin-bottom:8px}
.toc a{display:block;text-decoration:none;color:var(--mut);padding:7px 12px;border-radius:10px;font-weight:700}
.toc a.on{background:var(--soft);color:var(--red)}
.sec{padding:34px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:0}
.sec .cps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:18px 0 20px}
.cpl{display:block;text-decoration:none;color:var(--ink);border-radius:20px;padding:16px 18px;background:var(--soft);border:2px solid transparent}
.cpl:hover{border-color:var(--red)}
.cpl .stage{margin:0 0 8px;font-size:12px;padding:3px 10px}
.cpl b{font-family:Poppins,sans-serif;display:block;font-size:16px;line-height:1.3}
.cpl span{font-size:14px;color:var(--mut)}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{cursor:pointer;font-weight:800;font-size:17px}
.faq details p{margin:.6em 0 0}
.ugc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
@media (max-width:640px){.ugc{grid-template-columns:repeat(2,1fr)}}
.ugc div{aspect-ratio:4/5;border-radius:20px;background:var(--p1);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-size:13px;font-weight:700;position:relative;overflow:hidden}
.ugc div:nth-child(2n){background:var(--p2)}
.ugc div span{font-size:34px;position:absolute;top:14px;left:14px}
/* lead banner */
.lm{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:var(--ink);color:var(--bg);border-radius:28px;padding:26px 30px;margin:10px 0 40px}
.lm .doc{width:74px;height:94px;border-radius:10px;background:var(--red);display:grid;place-items:center;color:#fff;font:800 13px Poppins,sans-serif;text-align:center;line-height:1.2;transform:rotate(-5deg)}
.lm h3{margin:0 0 4px;font-size:21px}.lm p{margin:0;opacity:.85;font-size:15px}
@media (max-width:700px){.lm{grid-template-columns:1fr}}
.sticky-lm{display:none}
@media (max-width:700px){.sticky-lm{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:center;box-shadow:0 10px 30px rgba(120,0,25,.35)}}
/* CP pages */
.cph{padding:8px 0 26px;max-width:820px}
.cph .intro{font-size:19px;color:var(--mut)}
.module{background:var(--pp);border:2px solid var(--line);border-radius:28px;padding:28px;margin-bottom:30px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.opt button{font:700 15px Nunito,sans-serif;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 15px;cursor:pointer}
.opt button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.lab{font-weight:800;font-size:15px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.item b{font-family:Poppins,sans-serif;display:block;line-height:1.3;margin-bottom:4px}
.item .em{font-size:30px;display:block;margin-bottom:6px}
.muted{color:var(--mut);font-size:14px}
.next{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:var(--red);color:#fff;border-radius:26px;padding:24px 28px;margin:10px 0 46px}
.next a.btn{background:#fff;color:var(--red)}
.next small{opacity:.85;display:block;font-weight:700}
.next h3{margin:2px 0 0;font-size:21px}
@media (max-width:640px){.next{grid-template-columns:1fr}}
table.cmp{width:100%;border-collapse:collapse;font-size:15px;background:var(--card);border-radius:16px;overflow:hidden}
.tw{overflow-x:auto}
table.cmp th{background:var(--ink);color:var(--bg);text-align:left;padding:10px 12px;font-family:Poppins,sans-serif;font-size:14px;cursor:pointer;white-space:nowrap}
table.cmp td{padding:10px 12px;border-bottom:1px solid var(--line)}
.check label{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--red);margin-top:3px;flex:none}
.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--red);border-radius:999px;transition:width .3s}
.count{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 22px}
.count div{background:var(--red);color:#fff;border-radius:20px;padding:14px 10px;min-width:92px;text-align:center}
.count b{font:800 38px/1 Poppins,sans-serif;display:block}
.count span{font-size:13px;font-weight:700;opacity:.9}
select,input[type=text],input[type=email]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 14px}
select:focus,input:focus{border-color:var(--red);outline:none}
.field{margin-bottom:14px}.field label{display:block;font-weight:800;font-size:15px;margin-bottom:5px}
.err{color:var(--red);font-size:14px;font-weight:700;min-height:1.2em}
.stock{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px}
.dot{font-weight:800;font-size:14px;border-radius:999px;padding:3px 10px}
.ok{background:#DDF5E3;color:#145C2A}.low{background:#FFF1C7;color:#6B4B00}.out{background:#EEE;color:#555}
.quote{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;font-size:15px}
.quote b{display:block;font-size:14px;margin-top:6px;color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.kit{background:var(--red);color:#fff;border-radius:22px;padding:20px}
.kit .btn{background:#fff;color:var(--red)}
/* SEO layer */
.seo-btn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 18px;font:700 15px Poppins,sans-serif;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.25)}
@media (max-width:700px){.seo-btn{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.seo{position:fixed;top:0;right:0;height:100%;width:min(430px,100%);background:var(--card);z-index:60;border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .3s;overflow-y:auto;padding:calc(22px + env(safe-area-inset-top,0px)) 24px calc(30px + env(safe-area-inset-bottom,0px))}
.seo.on{transform:none}
.seo h2{font-size:22px}
.seo dt{font-weight:800;font-size:13px;color:var(--mut);margin-top:14px}
.seo dd{margin:3px 0 0;font-size:15px;word-break:break-word}
.seo .serp{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.serp .u{font-size:13px;color:#1a7f37}.serp .t{color:#1a0dab;font-size:18px;line-height:1.3;margin:2px 0}.serp .d{font-size:14px;color:var(--mut)}
:root[data-theme="dark"] .serp .t{color:#8AB4F8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .serp .t{color:#8AB4F8}}
.okc{color:#1a7f37;font-weight:800}
.seo ul{padding-left:18px;margin:4px 0;font-size:15px}
.x{float:right;border:0;background:var(--soft);color:var(--ink);border-radius:999px;width:38px;height:38px;font-size:20px;cursor:pointer}
/* map page */
.mapg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
@media (max-width:760px){.mapg{grid-template-columns:1fr}}
.mcol{border-radius:24px;padding:16px}
.mcol h3{font-size:16px}
.mapp{display:block;text-align:center;background:var(--red);color:#fff;border-radius:999px;padding:18px;text-decoration:none;font:700 19px Poppins,sans-serif;margin:8px auto 0;max-width:520px}
.toast{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;z-index:70;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;text-align:center}
.toast.on{opacity:1}
footer{background:var(--soft);padding:34px 0 90px;font-size:14px;color:var(--mut);margin-top:30px}
footer .wrap{display:grid;grid-template-columns:2fr 1fr 1fr;gap:26px}
footer a{color:var(--mut);display:block;text-decoration:none;margin:3px 0}footer a:hover{color:var(--red)}
footer b{color:var(--ink);font-family:Poppins,sans-serif}
@media (max-width:700px){footer .wrap{grid-template-columns:1fr}}
/* editor */
.ed-btn{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--red);color:#fff;border:0;border-radius:999px;padding:12px 18px;font:700 15px Poppins,sans-serif;cursor:pointer;box-shadow:0 10px 26px rgba(150,0,30,.3)}
@media (max-width:700px){.ed-btn{bottom:calc(128px + env(safe-area-inset-bottom,0px));padding:9px 14px;font-size:13px}.seo-btn{padding:9px 14px;font-size:13px}}
.ed{position:fixed;top:0;left:0;height:100%;width:min(460px,100%);background:var(--card);z-index:65;border-right:1px solid var(--line);box-shadow:20px 0 50px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .3s;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(30px + env(safe-area-inset-bottom,0px))}
.ed.on{transform:none}
.ed h2{font-size:21px;margin-bottom:4px}
.ed .grp{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.ed .grp>summary{cursor:pointer;font:700 15px Poppins,sans-serif;padding:13px 16px;background:var(--soft);list-style:none}
.ed .grp>summary::-webkit-details-marker{display:none}
.ed .grp>summary::before{content:"▸ ";color:var(--red)}
.ed .grp[open]>summary::before{content:"▾ "}
.ed .grp .body{padding:14px 16px}
.ed label{display:block;font-weight:800;font-size:13px;margin:10px 0 4px}
.ed input[type=text],.ed textarea,.ed select{width:100%;font:inherit;font-size:14px;padding:9px 11px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.ed textarea{min-height:92px;resize:vertical;line-height:1.5}
.ed input[type=color]{width:52px;height:34px;padding:2px;border:2px solid var(--line);border-radius:8px;background:var(--bg);vertical-align:middle}
.ed .row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ed .row input[type=text]{flex:1}
.ed .del{border:0;background:var(--soft);color:var(--red);border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer;flex:none}
.ed .add{margin-top:8px;font:700 13px Nunito,sans-serif;border:2px dashed var(--line);background:none;color:var(--red);border-radius:10px;padding:7px 12px;cursor:pointer}
.ed .hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.ed .cnt{font-size:12px;font-weight:800;float:right}
.ed .ok{color:#1a7f37}.ed .bad{color:var(--red)}
.ed .bar{position:sticky;top:0;background:var(--card);padding:6px 0 12px;z-index:2;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.ed .bar .btn{padding:10px 16px;font-size:14px}
.ed table.grid{width:100%;font-size:13px;border-collapse:collapse}
.ed table.grid td{padding:2px}
.ed table.grid input{width:100%;font-size:13px;padding:7px 8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.ed table.grid th{font:800 12px Nunito,sans-serif;text-align:left;color:var(--mut);padding:0 4px 4px}
.ed .state{font-size:13px;color:var(--mut);margin-top:10px}

/* imágenes y móvil */
.item .thumb{width:100%;height:120px;object-fit:cover;border-radius:12px;margin-bottom:8px;display:block}
#lnd .thumb{width:120px;height:90px;object-fit:cover;border-radius:12px;float:left;margin:0 14px 6px 0}
.heroimg img{width:100%;border-radius:36px;display:block;aspect-ratio:4/3.4;object-fit:cover}
.pagimg{margin:0 0 26px}
.pagimg img{width:100%;max-height:340px;object-fit:cover;border-radius:28px;display:block}
.ugc div em{font-style:normal;position:relative;z-index:1}
.ugc div .cap{background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:4px 8px;display:inline-block}
.burger{display:none;border:0;background:var(--soft);color:var(--ink);border-radius:12px;width:42px;height:42px;font-size:20px;cursor:pointer;flex:none}

":"decoración toy story","title":"Decoración Toy Story: 10 Ideas para Habitación Infantil","meta":"Ideas para decorar y ordenar la pieza de tu hijo al estilo Toy Story sin perder la estética del hogar. Descarga gratis la plantilla de orden.","h1":"Habitación Toy Story: 10 ideas para decorar y ordenar con estilo","intro":"La colección también se vive en casa. Estas ideas ayudan a decorar la pieza de tu hijo sin que parezca juguetería, y son parte del [[pp|universo Toy Story en casa]].","down":"ideas para decorar una habitación Toy Story","up":"universo Toy Story en casa","next":"cp6","silo":"Hogar","schema":"Article, ImageObject, BreadcrumbList"},"cp3":{"path":"coleccionables/yoyo-toy-story-5","stage":"d","name":"La colección pieza por pieza","kw":"miniso toy story 5","title":"Colección Toy Story 5 de Miniso: Pieza por Pieza","meta":"Peluches, tazas, bolsos y papelería de la colección Pixar x Miniso Toy Story 5. Conoce cada línea y encuentra la favorita en tu tienda.","h1":"Colección Pixar x Miniso Toy Story 5: pieza por pieza","intro":"La colección de Toy Story 5 en Miniso va mucho más allá del peluche: hay bolsos, hogar, papelería y accesorios. Aquí te mostramos cada línea; el panorama completo está en la [[pp|guía Toy Story de Miniso]].","down":"la colección Toy Story 5 pieza por pieza","up":"guía Toy Story de Miniso","next":"cp4","silo":"Coleccionables","schema":"Article, ItemList, BreadcrumbList"},"cp4":{"path":"coleccionables/peluches-seguros","stage":"c","name":"Peluches seguros por edad","kw":"peluche toy story","title":"Peluche Toy Story Seguro: Checklist por Edad | Miniso","meta":"Qué revisar antes de comprar un peluche Toy Story: edad, costuras, etiquetas y licencia oficial. Descarga el checklist gratis y compra seguro.","h1":"Peluches Toy Story seguros: checklist por edad y licencia oficial","intro":"El peluche suele ser la primera pieza de la colección que llega a casa. Antes de comprar, revisa estos puntos según la edad; si quieres ver todas las licencias y productos, vuelve a los [[pp|peluches y licencias en la guía Toy Story]].","down":"cómo elegir un peluche Toy Story seguro","up":"peluches y licencias en la guía Toy Story","next":"cp8","silo":"Coleccionables","schema":"Article, HowTo, BreadcrumbList"},"cp5":{"path":"regalos/regalos-por-edad","stage":"c","name":"Regalos por edad","kw":"regalos toy story","title":"Regalos Toy Story por Edad y Presupuesto | Miniso Chile","meta":"Regalos Toy Story para niños y fans adultos, ordenados por edad y presupuesto. Arma tu regalo en minutos y retíralo en tu tienda Miniso.","h1":"Regalos Toy Story por edad y presupuesto","intro":"Toy Story se regala en dos generaciones: los niños conocen a los personajes y los adultos crecieron con ellos. Filtra por edad y presupuesto; más ideas en los [[pp|regalos dos en uno de la guía]].","down":"regalos Toy Story por edad","up":"regalos dos en uno de la guía","next":"cp9","silo":"Regalos","schema":"Article, ItemList, Product"},"cp6":{"path":"hogar/organizar-coleccionables","stage":"c","name":"Exhibir coleccionables","kw":"vitrina coleccionables","title":"Vitrinas y Organizadores para Coleccionables | Miniso","meta":"Compara organizadores y vitrinas Miniso para exhibir tu colección Toy Story por tamaño, uso y precio. Elige el tuyo y retíralo en tienda.","h1":"Cómo exhibir y guardar coleccionables: comparativa de organizadores","intro":"Una colección que crece necesita un lugar. Compara organizadores y vitrinas según tu espacio; si buscas ideas de decoración, revisa el [[pp|orden estilo Toy Story]].","down":"organizadores para tu colección","up":"orden estilo Toy Story","next":"lead","silo":"Hogar","schema":"Article, VideoObject, Product"},"cp7":{"path":"regalos/drops","stage":"x","name":"Calendario de drops","kw":"lanzamientos miniso chile","title":"Lanzamientos Toy Story Miniso Chile: Calendario y Reserva","meta":"Fechas de los próximos drops Toy Story en Miniso Chile y cómo reservar sin hacer fila. Activa tu alerta y asegura el tuyo con MinisoLover.","h1":"Calendario de drops Toy Story en Miniso Chile","intro":"Las piezas limitadas se agotan rápido. Aquí están los próximos lanzamientos y cómo reservar sin hacer fila; para entender cada serie, vuelve a [[pp|todo sobre coleccionables Toy Story]].","down":"próximos drops y reservas","up":"todo sobre coleccionables Toy Story","next":"cp8","silo":"Regalos","schema":"Event, BreadcrumbList"},"cp8":{"path":"regalos/stock-tiendas","stage":"x","name":"Stock por tienda","kw":"miniso stock tienda","title":"Stock Toy Story por Tienda: Encuentra el Tuyo | Miniso","meta":"Revisa en qué tienda Miniso hay peluches y blind boxes Toy Story disponibles. Consulta por WhatsApp y reserva antes de que se agote.","h1":"Stock Toy Story por tienda: encuentra tu peluche o blind box","intro":"Confirma antes de salir de casa. Elige tu tienda y mira qué hay disponible; si todavía estás decidiendo, vuelve a la [[pp|guía Toy Story Miniso]].","down":"revisa el stock en tu tienda","up":"guía Toy Story Miniso","next":"cp9","silo":"Regalos","schema":"LocalBusiness, Product/Offer"},"cp9":{"path":"regalos/kit-dos-en-uno","stage":"x","name":"Kit dos en uno + UGC","kw":"kit regalo toy story","title":"Kit Toy Story Mamá + Hijo: Unboxings Reales | Miniso","meta":"Un regalo Toy Story para tu hijo y otro para ti, recomendado por mamás de la comunidad. Mira los unboxings y llévate tu kit.","h1":"Kit “dos en uno” Toy Story: uno para tu hijo, uno para ti","intro":"Uno para tu hijo y uno para ti. Arma tu kit y mira cómo lo abrieron otras mamás; más ideas en [[pp|más regalos en la guía Toy Story]].","down":"kit dos en uno con unboxings reales","up":"más regalos en la guía Toy Story","next":"pp","silo":"Regalos","schema":"Product, Review, VideoObject"},"lead":{"path":"guia-coleccionismo","stage":"l","name":"Guía de Coleccionismo","kw":"guía coleccionismo toy story","name_largo":"Guía de Coleccionismo y Organización Toy Story para Mamás","title":"Guía Gratis de Coleccionismo Toy Story para Mamás | Miniso","meta":"Descarga gratis la guía de coleccionismo y orden Toy Story: plantilla imprimible, tracker de la serie y 100 puntos MinisoLover de regalo.","h1":"Tu colección Toy Story ordenada, tu hijo feliz y tú sin perderte ni un drop","intro":"Descarga gratis la Guía de Coleccionismo y Organización Toy Story para Mamás y gana 100 puntos MinisoLover.","next":"cp7","schema":"WebPage (gracias: noindex)"}},"pasos":{"cp7":"¿Te gustó la serie? Mira cuándo llega el próximo drop","cp6":"Ya tienes la idea: elige dónde exhibir la colección","cp4":"Antes de elegir un peluche, revisa esto","cp8":"¿Lo encontraste? Revisa si hay stock en tu tienda","cp9":"Arma un kit para tu hijo y otro para ti","lead":"Descarga gratis la plantilla de orden","pp":"Vuelve a la guía completa"},"pilar":{"hero_caja":"Toca la caja y descubre tu figura","hero_nota":"Serie de ejemplo para el prototipo · [[cp1|¿cómo funciona la figura secreta?]]","lm_texto":"PDF + plantilla imprimible de orden + tracker de la serie. Te regalamos 100 puntos MinisoLover.","ugc_texto":"Comparte tu unboxing con **#MinisoToyStory** y gana 50 puntos MinisoLover.","progresion":"CP1 → CP7 · CP3 → CP4 → CP8 · CP2 → CP6 → Guía de Coleccionismo · CP5 → CP9 → MinisoLover","secciones":[{"titulo":"El universo Toy Story en Miniso","texto":"Con el estreno de Toy Story 5, Miniso lanzó junto a Pixar una colección amplia: el peluche grande de Woody, figuras y llaveros, taza con tapa de sombrero, cojín con forma de bota, bolso tote de mezclilla, estuches con estampado de vaca y papelería. Revisa [[cp3|la colección Toy Story 5 pieza por pieza]] antes de decidir por dónde empezar.","cta":"Ver la colección completa","cta_destino":"cp3","cps":"cp3"},{"titulo":"Blind boxes y coleccionables: cómo empezar","texto":"Una blind box es una caja cerrada: sabes de qué serie es, pero no qué figura trae. Esa sorpresa es lo que se vuelve viral en TikTok. Antes de comprar la primera, aprende [[cp1|cómo funcionan las blind box de Toy Story]], qué tan difícil es la figura secreta y cómo coleccionar en familia sin gastar de más. Si ya estás enganchada, mira los [[cp7|próximos drops y reservas]].","cta":"Ver blind boxes con stock en tu tienda","cta_destino":"cp8","cps":"cp1,cp7"},{"titulo":"Peluches Toy Story seguros para cada edad","texto":"El peluche suele ser el primer producto de la colección que llega a casa. Para un niño pequeño importan la edad recomendada, las costuras, las piezas pequeñas y la etiqueta de licencia oficial. Te dejamos un checklist sobre [[cp4|cómo elegir un peluche Toy Story seguro]] y, cuando elijas, puedes [[cp8|revisar el stock en tu tienda]].","cta":"Revisar stock de peluches","cta_destino":"cp8","cps":"cp4,cp8"},{"titulo":"Habitación y orden estilo Toy Story","texto":"La colección también vive en la pieza: el cojín bota sobre la cama, el sombrero colgado en la pared, la repisa con las figuras y una caja de juguetes que se ve bien. Encuentra [[cp2|ideas para decorar una habitación Toy Story]] y compara [[cp6|organizadores para tu colección]] según tu espacio.","cta":"Descarga gratis la Guía de Coleccionismo y Organización","cta_destino":"lead","cps":"cp2,cp6"},{"titulo":"Regalos Toy Story: para ellos y para ti","texto":"Toy Story funciona en dos generaciones: los niños quieren el peluche y las figuras, y a los adultos les sirve el tote de mezclilla, la taza o el neceser. Por eso reunimos [[cp5|regalos Toy Story por edad]] y un [[cp9|kit dos en uno con unboxings reales]] para regalarle a tu hijo y darte un gusto.","cta":"Arma tu kit dos en uno","cta_destino":"cp9","cps":"cp5,cp9"},{"titulo":"Drops Toy Story: cómo no quedarte sin el tuyo","texto":"Las piezas de edición limitada se agotan rápido. Activa alertas en el [[cp7|calendario de próximos drops y reservas]], confirma disponibilidad antes de salir de casa y únete a MinisoLover para tener acceso anticipado.","cta":"Reservar la mía","cta_destino":"cp7","cps":"cp7,cp8"}],"faq":[["¿Los productos Toy Story de Miniso son oficiales?","Sí. La colección es una colaboración oficial de Pixar con Miniso; revisa la etiqueta de licencia en el empaque. Más detalles en [[cp4|qué revisar antes de comprar un peluche]]."],["¿Se puede saber qué figura trae una blind box?","No: la gracia es la sorpresa. Lo que sí puedes conocer es la serie completa y la rareza de cada figura. Te lo explicamos en [[cp1|la guía de blind boxes]]."],["¿Cómo sé si hay stock en mi tienda?","Usa el [[cp8|buscador de stock por tienda]] y confirma por WhatsApp antes de ir."],["¿Cuándo llega el próximo lanzamiento?","Revisa el [[cp7|calendario de drops]] y activa una alerta para tu personaje favorito."]],"ugc":[["🤠","@mamá_creadora · Woody para Tomi"],["📦","@coleccionaconsofi · 3 blind boxes"],["🚀","@casaordenada.cl · repisa espacial"],["🎁","@regalosconamor · kit dos en uno"]]},"datos":{"figuras":[["🤠","Woody","com","30"],["🚀","Buzz Lightyear","com","30"],["⭐","Jessie","com","20"],["🦖","Rex","rar","8"],["👽","Aliens","rar","8"],["🐴","Tiro al Blanco","rar","3.6"],["✨","Woody dorado (secreta)","sec","0.4"]],"cp1_texto":"Cada serie tiene figuras comunes, algunas raras y una secreta que aparece muy pocas veces. Esta es una serie de ejemplo: edítala cuando conozcas la serie real que llegue a Chile.","consejos":[["🎯","Elige tu meta","Decide si vas por la serie completa o solo por tu personaje favorito."],["🔁","Cambia las repetidas","Organiza trueques con otras familias de tu comunidad."],["🗓️","Compra en los drops","Las series nuevas llegan por lote: el calendario te avisa."]],"ideas":[["Dormitorio","🛋️","El cojín bota como acento","Un solo objeto con forma llamativa ordena la cama sin llenarla de personajes."],["Dormitorio","🎩","El sombrero en la pared","Colgado sobre la cabecera funciona como cuadro y deja la repisa libre."],["Dormitorio","💡","Luz cálida y fondo neutro","Paredes claras para que el color lo pongan los objetos de la colección."],["Rincón de juego","📦","La caja de juguetes con tapa","Todo a la vista cuando juega, todo guardado en un minuto."],["Rincón de juego","🧸","Zona de peluches","Un canasto para el Woody grande evita que termine en el suelo."],["Rincón de juego","✏️","Mesa de papelería","Lápices, notas y stickers de la colección en un organizador."],["Repisa","⭐","Vitrina para las figuras","Las figuras y llaveros lucen mejor en escalones y con espacio entre ellos."],["Repisa","🐮","Un guiño al estampado vaca","Neceser o estuche a la vista repiten el patrón sin recargar."],["Repisa","🌿","Mezcla con objetos neutros","Plantas y libros equilibran el rojo y el amarillo."]],"lineas":[["Peluches y figuras","🧸","Woody en varios tamaños, desde el peluche grande hasta el llavero, más figuras para exhibir en la repisa."],["Bolsos y estuches","👜","Tote de mezclilla con charm, estuche transparente Howdy y neceser con estampado de vaca."],["Hogar y cocina","☕","Taza con tapa en forma de sombrero, cojín con forma de bota y textiles para el rincón de juego."],["Papelería","✏️","Lápices, notas adhesivas, stickers y cuadernos para el colegio o el escritorio."],["Accesorios","🎩","Botella con charm, llaveros y detalles para colgar en la mochila o la cartera."]],"checklist":[["0–2 años","Etiqueta indica apto desde 0 meses"],["0–2 años","Sin ojos de plástico ni piezas que se desprendan"],["0–2 años","Costuras firmes y sin hilos sueltos"],["0–2 años","Tamaño mayor que su boca"],["0–2 años","Se puede lavar a máquina"],["0–2 años","Etiqueta de licencia oficial"],["3–5 años","Edad recomendada 3+ en el empaque"],["3–5 años","Accesorios bien cosidos"],["3–5 años","Relleno que no se escapa al apretar"],["3–5 años","Sin cordones largos"],["3–5 años","Etiqueta de licencia oficial"],["6+ y adultos","Edad recomendada en el empaque"],["6+ y adultos","Vinyl plush: cadena del charm firme"],["6+ y adultos","Etiqueta de licencia oficial"],["6+ y adultos","Boleta guardada para cambios"]],"regalos":[["🧸","Peluche Woody 35 cm","0–5 años","19990","hijo"],["🛋️","Cojín con forma de bota de Woody","0–5 años","16990","hijo"],["🤠","Peluche llavero de Woody","0–5 años","7990","hijo"],["🪄","Figura articulada de Woody","6–12 años","12990","hijo"],["🧴","Estuche transparente Howdy","6–12 años","6990","hijo"],["✏️","Set de lápices Toy Story","6–12 años","4990","hijo"],["📝","Set de notas y stickers","6–12 años","5990","hijo"],["👜","Bolso tote de mezclilla con charm","Fan adulto","14990","mi"],["☕","Taza con tapa de sombrero","Fan adulto","8990","mi"],["🥤","Botella con charm de Woody","Fan adulto","11990","mi"],["🐮","Neceser estampado vaca","Fan adulto","9990","mi"],["🎩","Llavero sombrero de vaquero","Fan adulto","5990","mi"]],"organizadores":[["Vitrina acrílica 3 niveles","Repisa","12","15990","Blind boxes a la vista y sin polvo"],["Caja organizadora con tapa","Rincón de juego","40","9990","Juguetes grandes y peluches"],["Escalera exhibidora","Repisa","18","11990","Figuras en escalones"],["Canasto plegable","Dormitorio","25","7990","Peluches y ropa de juego"],["Organizador colgante","Dormitorio","16","8990","Espacios pequeños"]],"drops":[["2026-10-03T10:00:00-03:00","Blind boxes Toy Story · Serie 2","📦"],["2026-10-24T10:00:00-03:00","Vinyl plush YOYO edición Halloween","🎃"],["2026-11-28T10:00:00-03:00","Pack Navidad Toy Story","🎁"]],"tiendas":["Mall Plaza La Serena","Costanera Center","Parque Arauco","Mall Plaza Vespucio","Mall Plaza Oeste","Mall Marina (Viña del Mar)"],"productos":["Peluche Woody 35 cm","Peluche llavero de Woody","Cojín bota de Woody","Taza con tapa de sombrero","Bolso tote de mezclilla","Botella con charm de Woody"],"lm_bloques":[["📘","E-book de 12 páginas","Coleccionismo y orden infantil"],["🏷️","Plantilla imprimible","Etiquetas y rutina de guardado"],["✅","Tracker de la serie","Marca las figuras que tienes"]],"consentimiento":"Acepto el tratamiento de mis datos (Ley 19.628) y unirme a MinisoLover.","testimonios":[["“Tomi no suelta a su Woody y yo me quedé con el charm de YOYO en la cartera.”","@mamá_creadora"],["“Lo retiré en tienda sin fila, justo el día del drop.”","@coleccionaconsofi"],["“El kit salió más barato que comprar por separado.”","@regalosconamor"]]},"imgs":{}}</script>
<script>

const SOURCE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const RAW=document.getElementById('cfg').textContent;
let CFG=JSON.parse(RAW),DIRTY=false;
try{const d=localStorage.getItem('mts_cfg');if(d){CFG=JSON.parse(d);DIRTY=true}}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pic(k,em,cls){const u=(CFG.imgs||{})[k];
 return u?`<img class="${cls||'thumb'}" src="${u}" alt="${esc(k.split(':').pop())}" loading="lazy">`:`<span class="em" aria-hidden="true">${esc(em||'')}</span>`}
async function share(){const u=location.href.split('#')[0];
 try{if(navigator.share){await navigator.share({title:document.title,url:u});return}}catch(e){}
 try{await navigator.clipboard.writeText(u);toast('Enlace copiado: pégalo donde quieras compartirlo')}catch(e){toast(u)}}
const ORDER=['pp','cp1','cp2','cp3','cp4','cp5','cp6','cp7','cp8','cp9','lead'];
const ST={d:['st-d','Descubrimiento · Atraer'],c:['st-c','Consideración · Convertir'],x:['st-x','Decisión · Cerrar'],p:['st-x','Pillar Page'],l:['st-c','Contenido premium']};
const P=id=>CFG.paginas[id];
const url=id=>'#/guia/toy-story/'+(P(id).path||'');
const clp=n=>'$'+Number(n).toLocaleString('es-CL');
function rich(t){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,(m,id,tx)=>CFG.paginas[id]?`<a href="${url(id)}">${tx}</a>`:tx).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')}
function theme(){const m=CFG.marca,r=document.documentElement.style;
 r.setProperty('--red',m.rojo);r.setProperty('--red-d',m.rojo_oscuro||m.rojo);r.setProperty('--ink',m.tinta);r.setProperty('--soft',m.suave);r.setProperty('--p1',m.suave);r.setProperty('--p2',m.medio);r.setProperty('--pp',m.suave)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2800)}
let pts=0;try{pts=JSON.parse(localStorage.getItem('mts_pts'))||0}catch(e){}
function setPts(n,why){pts=n;try{localStorage.setItem('mts_pts',JSON.stringify(n))}catch(e){}$('#pts').textContent='♥ '+pts+' pts';if(why)toast('+100 puntos MinisoLover · '+why)}
const stage=s=>`<span class="stage ${ST[s][0]}">${ST[s][1]}</span>`;
function crumbs(id){const p=P(id);let c=`<nav class="crumbs" aria-label="Migas de pan"><a href="${url('pp')}">Inicio</a> › <a href="${url('pp')}">${esc(P('pp').name)}</a>`;
 if(p.silo)c+=` › <span>${esc(p.silo)}</span>`;if(id!=='pp')c+=` › <span aria-current="page">${esc(p.name)}</span>`;return c+'</nav>'}
function nextBox(id){const n=P(id).next;if(!n||!CFG.paginas[n])return'';const t=CFG.pasos[n]||('Continúa con '+P(n).name);
 return `<section class="next"><div><small>Tu siguiente paso</small><h3>${esc(t)}</h3></div><a class="btn" href="${url(n)}">Ver ${esc(P(n).name.toLowerCase())}</a></section>`}
function cpHead(id){const p=P(id);return crumbs(id)+`<header class="cph">${stage(p.stage)}<h1>${esc(p.h1)}</h1><p class="intro">${rich(p.intro)}</p></header>`}

/* ---- blind box ---- */
function openBox(btn,out){if(btn.dataset.busy)return;btn.dataset.busy=1;btn.classList.remove('open');btn.classList.add('shake');
 setTimeout(()=>{btn.classList.remove('shake');btn.classList.add('open');
  const F=CFG.datos.figuras;let r=Math.random()*F.reduce((a,f)=>a+Number(f[3]),0),f=F[0];
  for(const x of F){if(r<Number(x[3])){f=x;break}r-=Number(x[3])}
  let n=1;try{n=(JSON.parse(localStorage.getItem('mts_open'))||0)+1;localStorage.setItem('mts_open',JSON.stringify(n))}catch(e){}
  const lab={com:['r-com','Común'],rar:['r-rar','Rara'],sec:['r-sec','¡Figura secreta!']}[f[2]]||['r-com','Común'];
  out.innerHTML=`<div class="fig"><span class="em" aria-hidden="true">${esc(f[0])}</span><div style="text-align:left"><b>${esc(f[1])}</b><span class="rar ${lab[0]}">${lab[1]}</span></div></div>
   <div class="muted" style="color:#fff;margin-top:8px">Cajas abiertas: ${n} · <button class="btn small" style="background:#fff;color:var(--red);padding:5px 12px" id="again">Abrir otra</button></div>`;
  out.querySelector('#again').onclick=()=>openBox(btn,out);delete btn.dataset.busy},520)}
const boxHTML=(h,txt)=>`<div class="boxstage"${h?` style="min-height:${h}"`:''}><button class="bbox" id="bbox" aria-label="Abrir una blind box de ejemplo"><span class="body"></span><span class="lid"></span><span class="rib"></span><span class="q">?</span></button><div class="reveal" id="rev" aria-live="polite"><b style="font-family:Poppins;font-size:19px">${txt}</b></div></div>`;

/* ---- pillar ---- */
function pillar(){const s=CFG.pilar;

function toggleSeo(on){$('#seo').classList.toggle('on',on);$('#seoBtn').setAttribute('aria-expanded',on);$('#seoBtn').textContent=on?'Ocultar capa SEO':'Ver capa SEO'}
$('#seoBtn').onclick=()=>toggleSeo(!$('#seo').classList.contains('on'));

/* ---- búsqueda ---- */
const q=$('#q'),sg=$('#sugg');
q.oninput=()=>{const t=q.value.toLowerCase().trim();if(!t){sg.style.display='none';return}
 const r=ORDER.filter(k=>(P(k).kw+' '+P(k).h1+' '+P(k).name).toLowerCase().includes(t)).slice(0,6);
 sg.innerHTML=r.length?r.map(k=>`<a href="${url(k)}">${esc(P(k).name)}<small>${esc(P(k).kw)}</small></a>`).join(''):`<a href="${url('pp')}">Sin resultados. Ver la guía completa<small>${esc(P('pp').kw)}</small></a>`;
 sg.style.display='block'};
q.onblur=()=>setTimeout(()=>sg.style.display='none',180);

/* ---- router ---- */
function chrome(){$('#brandName').textContent=CFG.marca.nombre;
 if((CFG.imgs||{}).logo)$('#brandLogo').src=CFG.imgs.logo;
 const items=[['pp',P('pp').name],['cp7','Drops'],['cp8','Stock']].map(n=>`<a href="${url(n[0])}">${esc(n[1])}</a>`).join('')+'<a href="#/mapa">Mapa del cluster</a>';
 $('#nav').innerHTML=items;
 $('#mnav').innerHTML='<b>Ir a</b>'+ORDER.map(k=>`<a href="${url(k)}">${esc(P(k).name)}</a>`).join('')+'<a href="#/mapa">Mapa del cluster</a><button class="btn" id="mshare">Compartir este sitio</button>';
 $('#mnav').querySelectorAll('a').forEach(a=>a.onclick=()=>mnav(false));
 $('#mshare').onclick=()=>{mnav(false);share()};
 $('#foot').innerHTML=`<div><b>${esc(P('pp').name)} · ${esc(CFG.marca.nombre)}</b><p style="margin-top:6px">${esc(CFG.marca.footer)}</p></div>
 <div><b>Descubrir</b>${['cp1','cp2','cp3'].map(i=>`<a href="${url(i)}">${esc(P(i).name)}</a>`).join('')}</div>
 <div><b>Comprar</b>${['cp5','cp8','lead'].map(i=>`<a href="${url(i)}">${esc(P(i).name)}</a>`).join('')}</div>`}
let CURRENT='pp';
function route(){const h=location.hash||'#/guia/toy-story/';let id;
 if(h.startsWith('#/mapa'))id='mapa';
 else{const path=h.replace('#/guia/toy-story/','').replace(/\/$/,'');id=ORDER.find(k=>P(k).path===path)}
 if(!id){if(h.startsWith('#s')||h==='#faq')return;id='pp'}
 CURRENT=id;render()}
function render(){const id=CURRENT;theme();chrome();
 const app=$('#app');
 let html;
 if(id==='mapa')html=mapa();
 else if(id==='pp')html=pillar();
 else if(id==='lead')html=leadPage();
 else{const im=(CFG.imgs||{})['pagina:'+id];html=cpHead(id)+(im?`<div class="pagimg"><img src="${im}" alt="${esc(P(id).h1)}"></div>`:'')+(M[id]?M[id]():'')+nextBox(id)}
 app.innerHTML=`<div class="wrap">${html}</div>`;
 if(id==='pp')pillarInit();
 else if(id==='lead')leadInit();
 else if(M[id+'i'])M[id+'i']();
 if(id==='cp1'){const b=$('#bbox');if(b)b.onclick=()=>openBox(b,$('#rev'))}
 document.title=CFG.paginas[id]?P(id).title:'Mapa del cluster';
 seo(CFG.paginas[id]?id:null);sg.style.display='none';q.value='';window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

/* ================= EDITOR ================= */
const get=p=>p.split('.').reduce((o,k)=>o&&o[k],CFG);
function set(p,v){const ks=p.split('.'),l=ks.pop();ks.reduce((o,k)=>o[k],CFG)[l]=v;saveDraft()}
function saveDraft(){DIRTY=true;try{localStorage.setItem('mts_cfg',JSON.stringify(CFG))}catch(e){}$('#edState').textContent='Borrador guardado en este navegador. Publica para que lo vean todos.'}
function edOpen(on){$('#ed').classList.toggle('on',on);$('#edBtn').textContent=on?'Cerrar editor':'Editar contenido'}
$('#edBtn').onclick=()=>{const on=!$('#ed').classList.contains('on');edOpen(on);if(on)edRender()};
function field(label,path,type,hint,max){const v=get(path)||'';
 const cnt=max?`<span class="cnt ${v.length<=max?'ok':'bad'}" id="cnt-${path.replace(/\./g,'-')}">${v.length}/${max}</span>`:'';
 const inp=type==='textarea'?`<textarea data-p="${path}" data-max="${max||''}">${esc(v)}</textarea>`
  :type==='color'?`<input type="color" data-p="${path}" value="${esc(v)}">`
  :`<input type="text" data-p="${path}" data-max="${max||''}" value="${esc(v)}">`;
 return `<label>${label}${cnt}</label>${inp}${hint?`<div class="hint">${hint}</div>`:''}`}
function tableEd(path,cols,label){const rows=get(path)||[];
 return `<label>${label}</label><table class="grid"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead><tbody>
 ${rows.map((r,i)=>`<tr>${cols.map((c,j)=>`<td><input type="text" data-t="${path}" data-r="${i}" data-c="${j}" value="${esc(r[j])}"></td>`).join('')}
  <td><button class="del" data-del="${path}" data-r="${i}" title="Eliminar fila">×</button></td></tr>`).join('')}
 </tbody></table><button class="add" data-add="${path}" data-n="${cols.length}">+ Agregar fila</button>`}
function listEd(path,label){const rows=get(path)||[];
 return `<label>${label}</label>${rows.map((r,i)=>`<div class="row"><input type="text" data-l="${path}" data-r="${i}" value="${esc(r)}"><button class="del" data-dell="${path}" data-r="${i}">×</button></div>`).join('')}
 <button class="add" data-addl="${path}">+ Agregar</button>`}
const IMGKEYS=()=>{const L=[['logo','Logo del encabezado'],['hero','Imagen principal del hero (reemplaza la caja sorpresa)']];
 ORDER.forEach(k=>L.push(['pagina:'+k,'Portada de '+P(k).name]));
 CFG.datos.regalos.forEach(g=>L.push(['prod:'+g[1],'Producto · '+g[1]]));
 CFG.datos.lineas.forEach(l=>L.push(['linea:'+l[0],'Línea · '+l[0]]));
 CFG.datos.figuras.filter(f=>f[2]!=='sec').forEach(f=>L.push(['figura:'+f[1],'Personaje · '+f[1]]));
 CFG.datos.ideas.forEach(i=>L.push(['idea:'+i[2],'Idea · '+i[2]]));
 CFG.pilar.ugc.forEach((u,i)=>L.push(['ugc:'+i,'Comunidad · '+u[1]]));
 CFG.datos.lm_bloques.forEach(i=>L.push(['lm:'+i[1],'Guía · '+i[1]]));
 CFG.datos.consejos.forEach(i=>L.push(['consejo:'+i[1],'Consejo · '+i[1]]));
 return L};
function imgRow(k,label){const u=(CFG.imgs||{})[k];
 return `<div class="imgrow"><div class="prev">${u?`<img src="${u}" alt="">`:'<span>sin imagen</span>'}</div>
 <div style="flex:1"><b>${esc(label)}</b><div class="hint">${u?'Imagen cargada':'JPG o PNG · se ajusta sola'}</div>
 <label class="add" style="display:inline-block">${u?'Reemplazar':'Subir imagen'}<input type="file" accept="image/*" data-img="${esc(k)}" style="display:none"></label>
 ${u?`<button class="add" data-imgdel="${esc(k)}">Quitar</button>`:''}</div></div>`}
function pickImage(file,key){const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const max=key==='logo'?400:1100,sc=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
  const png=key==='logo'||/png$/i.test(file.type);
  CFG.imgs=CFG.imgs||{};CFG.imgs[key]=png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',0.82);
  const kb=Math.round(CFG.imgs[key].length*0.75/1024);
  saveDraft();render();edRender();$('#ed').querySelectorAll('.grp')[3]&&0;toast('Imagen agregada ('+kb+' KB)')};
  im.src=r.result};
 r.readAsDataURL(file)}
function edRender(){const pageSel=$('#ed').dataset.page||'pp',p=pageSel;
 const secs=CFG.pilar.secciones.map((s,i)=>`<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px">
  <b style="font-family:Poppins">Sección ${i+1}</b>
  ${field('Título','pilar.secciones.'+i+'.titulo','text')}
  ${field('Texto','pilar.secciones.'+i+'.texto','textarea','Usa [[cp1|texto del enlace]] para enlazar a una cluster page.')}
  ${field('Texto del botón','pilar.secciones.'+i+'.cta','text')}
  ${field('Destino del botón','pilar.secciones.'+i+'.cta_destino','text','Escribe el id: pp, cp1…cp9 o lead.')}
  ${field('Cluster pages que muestra','pilar.secciones.'+i+'.cps','text','Ids separados por coma, por ejemplo cp1,cp7')}</div>`).join('');
 $('#ed').innerHTML=`<div class="bar"><button class="btn small" id="edPub">Publicar cambios</button><button class="btn small ghost" id="edExp">Exportar JSON</button>
  <button class="btn small ghost" id="edShare">Compartir</button><button class="btn small ghost" id="edRes">Restaurar original</button><button class="btn small ghost" id="edClose">Cerrar</button></div>
 <h2>Editor de contenido</h2><p class="muted" style="font-size:14px">Cambia textos, colores y datos. La página se actualiza mientras escribes.</p>
 <div class="state" id="edState">${DIRTY?'Tienes cambios sin publicar en este navegador.':'Sin cambios pendientes.'}</div>

 <details class="grp"><summary>Marca y colores</summary><div class="body">
  ${field('Nombre de la marca','marca.nombre','text')}
  ${field('Bajada del hero','marca.tagline','textarea')}
  ${field('Hashtag','marca.hashtag','text')}
  ${field('Texto del pie de página','marca.footer','textarea')}
  <label>Colores</label>
  <div class="row"><input type="color" data-p="marca.rojo" value="${esc(CFG.marca.rojo)}"> <span>Principal</span></div>
  <div class="row"><input type="color" data-p="marca.rojo_oscuro" value="${esc(CFG.marca.rojo_oscuro)}"> <span>Principal oscuro (hover)</span></div>
  <div class="row"><input type="color" data-p="marca.tinta" value="${esc(CFG.marca.tinta)}"> <span>Texto</span></div>
  <div class="row"><input type="color" data-p="marca.suave" value="${esc(CFG.marca.suave)}"> <span>Fondo suave</span></div>
  <div class="row"><input type="color" data-p="marca.medio" value="${esc(CFG.marca.medio)}"> <span>Rosa medio</span></div>
 </div></details>

 <details class="grp"><summary>Páginas y SEO</summary><div class="body">
  <label>Elige la página</label><select id="edPage">${ORDER.map(k=>`<option value="${k}" ${k===p?'selected':''}>${k.toUpperCase()} · ${esc(P(k).name)}</option>`).join('')}</select>
  ${field('Nombre corto','paginas.'+p+'.name','text')}
  ${field('H1 (título visible)','paginas.'+p+'.h1','textarea')}
  ${field('Texto de introducción','paginas.'+p+'.intro','textarea','Usa [[pp|texto]] para enlazar.')}
  ${field('Keyword foco','paginas.'+p+'.kw','text')}
  ${field('Title tag','paginas.'+p+'.title','text','Máximo 60 caracteres.',60)}
  ${field('Meta description','paginas.'+p+'.meta','textarea','Máximo 155 caracteres.',155)}
  ${field('URL (slug)','paginas.'+p+'.path','text','Sin la barra inicial. Deja vacío para la pillar.')}
  ${p!=='pp'?field('Anchor PP → CP','paginas.'+p+'.down','text'):''}
  ${p!=='pp'?field('Anchor CP → PP','paginas.'+p+'.up','text'):''}
  ${field('Siguiente paso (id)','paginas.'+p+'.next','text')}
 </div></details>

 <details class="grp"><summary>Secciones de la pillar</summary><div class="body">
  ${field('Texto de la caja sorpresa','pilar.hero_caja','text')}
  ${field('Nota bajo la caja','pilar.hero_nota','text','Acepta [[cp1|texto]].')}
  ${secs}
  ${field('Texto del banner de la guía','pilar.lm_texto','textarea')}
  ${field('Texto sobre la comunidad','pilar.ugc_texto','textarea')}
  ${field('Progresión del embudo (mapa)','pilar.progresion','textarea')}
 </div></details>

 <details class="grp" id="grpImg"><summary>Imágenes</summary><div class="body">
  <p class="hint">Las imágenes se guardan dentro del mismo archivo, así que quedan disponibles al compartir el enlace o al descargar el HTML. Súbelas livianas: se redimensionan solas a 1100 px.</p>
  ${IMGKEYS().map(k=>imgRow(k[0],k[1])).join('')}</div></details>
 <details class="grp"><summary>Preguntas frecuentes</summary><div class="body">${tableEd('pilar.faq',['Pregunta','Respuesta'],'Cada fila es una pregunta')}</div></details>
 <details class="grp"><summary>Comunidad (UGC)</summary><div class="body">${tableEd('pilar.ugc',['Emoji','Texto'],'Tarjetas de la galería')}</div></details>
 <details class="grp"><summary>Serie de blind box</summary><div class="body">${tableEd('datos.figuras',['Emoji','Figura','Rareza','Prob. %'],'Rareza: com, rar o sec')}
  ${field('Texto de la CP1','datos.cp1_texto','textarea')}
  ${tableEd('datos.consejos',['Emoji','Título','Texto'],'Consejos para coleccionar')}</div></details>
 <details class="grp"><summary>Ideas de habitación</summary><div class="body">${tableEd('datos.ideas',['Espacio','Emoji','Título','Texto'],'El espacio agrupa las tarjetas')}</div></details>
 <details class="grp"><summary>Líneas de la colección</summary><div class="body">${tableEd('datos.lineas',['Línea','Emoji','Descripción'],'Pestañas de la CP3')}</div></details>
 <details class="grp"><summary>Checklist de seguridad</summary><div class="body">${tableEd('datos.checklist',['Edad','Punto a revisar'],'La edad agrupa los puntos')}</div></details>
 <details class="grp"><summary>Catálogo de regalos</summary><div class="body">${tableEd('datos.regalos',['Emoji','Producto','Público','Precio','hijo/mi'],'Público: el texto del filtro. Última columna: hijo o mi')}</div></details>
 <details class="grp"><summary>Organizadores</summary><div class="body">${tableEd('datos.organizadores',['Nombre','Espacio','Capacidad','Precio','Ideal para'],'Tabla comparativa de la CP6')}</div></details>
 <details class="grp"><summary>Drops</summary><div class="body">${tableEd('datos.drops',['Fecha','Lanzamiento','Emoji'],'Fecha en formato 2026-10-03T10:00:00-03:00')}</div></details>
 <details class="grp"><summary>Tiendas y productos</summary><div class="body">${listEd('datos.tiendas','Tiendas')}${listEd('datos.productos','Productos del buscador de stock')}</div></details>
 <details class="grp"><summary>Lead magnet</summary><div class="body">${tableEd('datos.lm_bloques',['Emoji','Título','Detalle'],'Bloques de la landing')}
  ${field('Texto del consentimiento','datos.consentimiento','textarea')}</div></details>
 <details class="grp"><summary>Testimonios</summary><div class="body">${tableEd('datos.testimonios',['Testimonio','Autor'],'Se muestran en la CP9')}</div></details>
 <details class="grp"><summary>Siguiente paso de cada página</summary><div class="body">${ORDER.filter(k=>k!=='pp').map(k=>field(P(k).name,'pasos.'+P(k).next,'text')).filter((v,i,a)=>a.indexOf(v)===i).join('')}</div></details>`;
 edWire()}
function edWire(){
 $('#edClose').onclick=()=>edOpen(false);
 $('#edPage').onchange=e=>{$('#ed').dataset.page=e.target.value;edRender();$('#ed').querySelectorAll('.grp')[1].open=true};
 $('#ed').querySelectorAll('[data-p]').forEach(i=>i.oninput=()=>{set(i.dataset.p,i.value);
  const max=+i.dataset.max||0;if(max){const c=document.getElementById('cnt-'+i.dataset.p.replace(/\./g,'-'));if(c){c.textContent=i.value.length+'/'+max;c.className='cnt '+(i.value.length<=max?'ok':'bad')}}
  render()});
 $('#ed').querySelectorAll('[data-t]').forEach(i=>i.oninput=()=>{get(i.dataset.t)[+i.dataset.r][+i.dataset.c]=i.value;saveDraft();render()});
 $('#ed').querySelectorAll('[data-l]').forEach(i=>i.oninput=()=>{get(i.dataset.l)[+i.dataset.r]=i.value;saveDraft();render()});
 $('#ed').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{get(b.dataset.del).splice(+b.dataset.r,1);saveDraft();render();edRender()});
 $('#ed').querySelectorAll('[data-dell]').forEach(b=>b.onclick=()=>{get(b.dataset.dell).splice(+b.dataset.r,1);saveDraft();render();edRender()});
 $('#ed').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{get(b.dataset.add).push(new Array(+b.dataset.n).fill(''));saveDraft();render();edRender()});
 $('#ed').querySelectorAll('[data-addl]').forEach(b=>b.onclick=()=>{get(b.dataset.addl).push('');saveDraft();render();edRender()});

 $('#ed').querySelectorAll('[data-img]').forEach(i=>i.onchange=e=>{const f=e.target.files[0];if(f)pickImage(f,i.dataset.img)});
 $('#ed').querySelectorAll('[data-imgdel]').forEach(b=>b.onclick=()=>{delete CFG.imgs[b.dataset.imgdel];saveDraft();render();edRender()});
 $('#edShare').onclick=share;
 $('#edExp').onclick=async()=>{const txt=JSON.stringify(CFG,null,2);
  try{const d=await claude.use('downloads');if(d){await d.save({filename:'contenido-guia-toy-story.json',data:txt});return}}catch(e){}
  try{await navigator.clipboard.writeText(txt);toast('JSON copiado al portapapeles')}catch(e){toast('No se pudo exportar')}};
 $('#edRes').onclick=()=>{if(!confirm('Se descartan todos los cambios de este navegador y vuelve el contenido publicado. ¿Seguir?'))return;
  try{localStorage.removeItem('mts_cfg')}catch(e){}location.reload()};
 $('#edPub').onclick=async()=>{const btn=$('#edPub');btn.textContent='Publicando…';
  try{const a=await claude.use('artifact');
   if(!a){btn.textContent='Publicar cambios';$('#edState').textContent='No puedes publicar desde esta vista (solo el dueño del artifact puede). Tus cambios quedan guardados en este navegador.';return}
   const doc=SOURCE.replace(/(<script id="cfg" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a1,b1)=>a1+JSON.stringify(CFG).replace(/</g,'\\u003c')+b1);
   await a.publish(doc);try{localStorage.removeItem('mts_cfg')}catch(e){}
   btn.textContent='Publicado';$('#edState').textContent='Publicado: ahora todos ven esta versión.'}
  catch(e){btn.textContent='Publicar cambios';$('#edState').textContent='No se pudo publicar ('+(e&&e.code?e.code:'error')+'). Tus cambios siguen guardados en este navegador.'}}}

function mnav(on){$('#mnav').classList.toggle('on',on);$('#burger').setAttribute('aria-expanded',on);$('#scrim').classList.toggle('on',on)}
$('#burger').onclick=()=>mnav(!$('#mnav').classList.contains('on'));
$('#scrim').onclick=()=>mnav(false);
$('#shareBtn').onclick=share;
/* ---- arranque ---- */
setPts(pts);route();

</script>
